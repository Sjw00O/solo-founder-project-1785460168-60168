<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .timer-display {
            text-align: center;
            font-size: 72px;
            font-weight: 700;
            color: #667eea;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }
        .timer-phase {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }
        .controls button {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-start {
            background: #667eea;
            color: white;
        }
        .btn-start:hover {
            background: #5a6fd6;
        }
        .btn-pause {
            background: #f0ad4e;
            color: white;
        }
        .btn-pause:hover {
            background: #ec971f;
        }
        .btn-reset {
            background: #d9534f;
            color: white;
        }
        .btn-reset:hover {
            background: #c9302c;
        }
        .settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .settings label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #555;
            font-size: 14px;
        }
        .settings input {
            width: 60px;
            padding: 5px 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        .tasks-section {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .tasks-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }
        .task-input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .task-input input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }
        .task-input button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .task-input button:hover {
            background: #5a6fd6;
        }
        .task-list {
            list-style: none;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .task-item span {
            flex: 1;
            font-size: 15px;
            color: #333;
        }
        .task-item span.done {
            text-decoration: line-through;
            color: #aaa;
        }
        .task-item button {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
        }
        .interrupt-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .interrupt-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        .interrupt-btn {
            padding: 8px 20px;
            background: #f0ad4e;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .interrupt-btn:hover {
            background: #ec971f;
        }
        .interrupt-list {
            margin-top: 10px;
            max-height: 120px;
            overflow-y: auto;
        }
        .interrupt-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            color: #666;
            border-bottom: 1px solid #f5f5f5;
        }
        .interrupt-item:last-child {
            border-bottom: none;
        }
        .stats {
            margin-top: 10px;
            font-size: 13px;
            color: #888;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 番茄钟</h1>
        <div class="timer-phase" id="phaseDisplay">专注时间</div>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="controls">
            <button class="btn-start" id="startBtn">开始</button>
            <button class="btn-pause" id="pauseBtn" style="display:none;">暂停</button>
            <button class="btn-reset" id="resetBtn">重置</button>
        </div>
        <div class="settings">
            <label>专注 <input type="number" id="focusMinutes" value="25" min="1" max="120"> 分钟</label>
            <label>休息 <input type="number" id="breakMinutes" value="5" min="1" max="60"> 分钟</label>
        </div>
        <div class="tasks-section">
            <h2>📋 任务列表</h2>
            <div class="task-input">
                <input type="text" id="taskInput" placeholder="添加新任务...">
                <button id="addTaskBtn">添加</button>
            </div>
            <ul class="task-list" id="taskList"></ul>
        </div>
        <div class="interrupt-section">
            <h2>⏸️ 中断记录</h2>
            <button class="interrupt-btn" id="interruptBtn">记录中断</button>
            <div class="interrupt-list" id="interruptList"></div>
            <div class="stats" id="statsDisplay"></div>
        </div>
        <div class="footer">数据存储在本地浏览器</div>
    </div>

    <script>
        // ========== 状态 ==========
        let state = {
            phase: 'focus', // 'focus' | 'break'
            running: false,
            timeLeft: 25 * 60,
            focusMinutes: 25,
            breakMinutes: 5,
            tasks: [],
            interrupts: []
        };

        let timerInterval = null;

        // ========== DOM 引用 ==========
        const timerDisplay = document.getElementById('timerDisplay');
        const phaseDisplay = document.getElementById('phaseDisplay');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const focusInput = document.getElementById('focusMinutes');
        const breakInput = document.getElementById('breakMinutes');
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');
        const interruptBtn = document.getElementById('interruptBtn');
        const interruptList = document.getElementById('interruptList');
        const statsDisplay = document.getElementById('statsDisplay');

        // ========== 本地存储 ==========
        function saveState() {
            const data = {
                phase: state.phase,
                running: false, // 不保存运行状态
                timeLeft: state.timeLeft,
                focusMinutes: state.focusMinutes,
                breakMinutes: state.breakMinutes,
                tasks: state.tasks,
                interrupts: state.interrupts
            };
            localStorage.setItem('pomodoro_state', JSON.stringify(data));
        }

        function loadState() {
            const raw = localStorage.getItem('pomodoro_state');
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    state.phase = data.phase || 'focus';
                    state.running = false;
                    state.timeLeft = data.timeLeft || 25 * 60;
                    state.focusMinutes = data.focusMinutes || 25;
                    state.breakMinutes = data.breakMinutes || 5;
                    state.tasks = data.tasks || [];
                    state.interrupts = data.interrupts || [];
                } catch(e) {
                    // 默认值
                }
            }
        }

        // ========== 计时器逻辑 ==========
        function updateDisplay() {
            const mins = Math.floor(state.timeLeft / 60);
            const secs = state.timeLeft % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            phaseDisplay.textContent = state.phase === 'focus' ? '专注时间' : '休息时间';
            // 按钮状态
            if (state.running) {
                startBtn.style.display = 'none';
                pauseBtn.style.display = 'inline-block';
            } else {
                startBtn.style.display = 'inline-block';
                pauseBtn.style.display = 'none';
            }
        }

        function tick() {
            if (state.timeLeft > 0) {
                state.timeLeft--;
                updateDisplay();
                // 每5秒保存一次
                if (state.timeLeft % 5 === 0) saveState();
            } else {
                // 切换阶段
                if (state.phase === 'focus') {
                    state.phase = 'break';
                    state.timeLeft = state.breakMinutes * 60;
                    phaseDisplay.textContent = '休息时间 🎉';
                } else {
                    state.phase = 'focus';
                    state.timeLeft = state.focusMinutes * 60;
                    phaseDisplay.textContent = '专注时间';
                }
                updateDisplay();
                saveState();
                // 播放提示音（简单蜂鸣）
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = 800;
                    osc.connect(ctx.destination);
                    osc.start();
                    setTimeout(() => osc.stop(), 200);
                } catch(e) {}
            }
        }

        function startTimer() {
            if (state.running) return;
            // 如果时间到0，重置为当前阶段
            if (state.timeLeft <= 0) {
                state.timeLeft = state.phase === 'focus' ? state.focusMinutes * 60 : state.breakMinutes * 60;
            }
            state.running = true;
            timerInterval = setInterval(tick, 1000);
            updateDisplay();
            saveState();
        }

        function pauseTimer() {
            if (!state.running) return;
            state.running = false;
            clearInterval(timerInterval);
            timerInterval = null;
            updateDisplay();
            saveState();
        }

        function resetTimer() {
            pauseTimer();
            state.phase = 'focus';
            state.timeLeft = state.focusMinutes * 60;
            updateDisplay();
            saveState();
        }

        function updateSettings() {
            const f = parseInt(focusInput.value) || 25;
            const b = parseInt(breakInput.value) || 5;
            state.focusMinutes = Math.max(1, Math.min(120, f));
            state.breakMinutes = Math.max(1, Math.min(60, b));
            focusInput.value = state.focusMinutes;
            breakInput.value = state.breakMinutes;
            // 如果计时器不在运行，更新显示
            if (!state.running) {
                if (state.phase === 'focus') {
                    state.timeLeft = state.focusMinutes * 60;
                } else {
                    state.timeLeft = state.breakMinutes * 60;
                }
                updateDisplay();
                saveState();
            }
        }

        // ========== 任务管理 ==========
        function renderTasks() {
            taskList.innerHTML = '';
            state.tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'task-item';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.done;
                checkbox.addEventListener('change', () => {
                    state.tasks[index].done = checkbox.checked;
                    saveState();
                    renderTasks();
                });
                const span = document.createElement('span');
                span.textContent = task.text;
                if (task.done) span.className = 'done';
                const delBtn = document.createElement('button');
                delBtn.textContent = '✕';
                delBtn.addEventListener('click', () => {
                    state.tasks.splice(index, 1);
                    saveState();
                    renderTasks();
                });
                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(delBtn);
                taskList.appendChild(li);
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;
            state.tasks.push({ text, done: false });
            taskInput.value = '';
            saveState();
            renderTasks();
        }

        // ========== 中断记录 ==========
        function renderInterrupts() {
            interruptList.innerHTML = '';
            // 显示最近5条
            const recent = state.interrupts.slice(-5).reverse();
            recent.forEach(item => {
                const div = document.createElement('div');
                div.className = 'interrupt-item';
                const time = new Date(item.time).toLocaleTimeString();
                div.innerHTML = `<span>${time}</span><span>${item.reason || '未记录原因'}</span>`;
                interruptList.appendChild(div);
            });
            // 统计
            const total = state.interrupts.length;
            statsDisplay.textContent = `今日中断次数: ${total}`;
        }

        function recordInterrupt() {
            const reason = prompt('记录中断原因（可选）:', '');
            // 用户点击取消则 reason 为 null
            state.interrupts.push({
                time: Date.now(),
                reason: reason !== null ? reason : '未记录'
            });
            saveState();
            renderInterrupts();
        }

        // ========== 初始化 ==========
        function init() {
            loadState();
            // 同步输入框
            focusInput.value = state.focusMinutes;
            breakInput.value = state.breakMinutes;
            // 如果时间异常则修正
            if (state.timeLeft <= 0 || state.timeLeft > 120*60) {
                state.timeLeft = state.focusMinutes * 60;
            }
            updateDisplay();
            renderTasks();
            renderInterrupts();

            // 事件绑定
            startBtn.addEventListener('click', startTimer);
            pauseBtn.addEventListener('click', pauseTimer);
            resetBtn.addEventListener('click', resetTimer);
            focusInput.addEventListener('change', updateSettings);
            breakInput.addEventListener('change', updateSettings);
            addTaskBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask();
            });
            interruptBtn.addEventListener('click', recordInterrupt);

            // 页面关闭前保存
            window.addEventListener('beforeunload', saveState);
        }

        init();
    </script>
</body>
</html>
